appId: com.taskking.app
productName: TaskKing
directories:
  output: dist
files:
  - src/main/**/*
  - build/**/*
  - package.json
  - node_modules/**/*
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
win:
  target:
    - portable
  icon: null
  sign: false
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
asar: true
